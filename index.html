<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماركت الأخوة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f27a1a;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e6e6e6;
            --input-bg: #f0f0f0;
            --shadow: rgba(0,0,0,0.05);
        }
        body.dark {
            --bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --text: #e0e0e0;
            --border: #444;
            --input-bg: #3a3a3a;
            --shadow: rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
        }
        #welcomeOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #welcomeOverlay h1 { font-size: 36px; margin-bottom: 10px; color: var(--primary); }
        #welcomeOverlay p { font-size: 18px; margin-bottom: 25px; opacity: 0.8; }
        #enterBtn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 22px; }
        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .header-actions i {
            font-size: 22px;
            cursor: pointer;
            position: relative;
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: red;
            color: white;
            font-size: 12px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dark-toggle, .music-toggle { cursor: pointer; font-size: 20px; }
        .search-section { padding: 15px; }
        .search-section input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 16px;
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        .categories {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            overflow-x: auto;
            flex-wrap: nowrap;
        }
        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s, border 0.3s;
            font-size: 14px;
        }
        .cat-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 2px 5px var(--shadow);
            position: relative;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: background 0.3s;
        }
        .fav-btn.active i { color: red; }
        .product-img {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--input-bg);
            font-size: 50px;
            color: #aaa;
            overflow: hidden;
            transition: background 0.3s;
        }
        .product-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 10px; flex-grow: 1; }
        .product-title { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .product-price { color: var(--primary); font-weight: bold; font-size: 16px; }
        .btn-add-cart {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 14px;
        }
        #cartModal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #cartModal.open { display: flex; }
        .cart-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            transition: background 0.3s;
        }
        .cart-content h2 { margin-bottom: 15px; color: var(--primary); text-align: center; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            transition: border 0.3s;
        }
        .cart-total {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            color: var(--primary);
        }
        .cart-content input, .cart-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        .cart-content textarea { resize: vertical; min-height: 60px; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-close { background: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="welcomeOverlay">
        <h1>🛒 ماركت الأخوة</h1>
        <p>أهلاً وسهلاً بك في متجرنا</p>
        <button id="enterBtn">دخول المتجر</button>
    </div>

    <!-- قم بتغيير اسم ملف الصوت وتسهيله لضمان عدم حدوث خطأ 404 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>

    <div class="header">
        <h1>🛒 ماركت الأخوة</h1>
        <div class="header-actions">
            <span class="music-toggle" id="toggleMusicBtn" title="تشغيل/إيقاف الموسيقى">
                <i class="fa-solid fa-volume-xmark" id="musicIcon"></i>
            </span>
            <span class="dark-toggle" title="تبديل المظهر">
                <i class="fa-solid fa-moon" id="darkModeIcon"></i>
            </span>
            <span style="position:relative; cursor:pointer;" onclick="window.toggleCartModal()" title="السلة">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartCount">0</span>
            </span>
        </div>
    </div>

    <div class="search-section">
        <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج..." oninput="window.filterBySearch(this.value)">
    </div>

    <div class="categories">
        <span class="cat-chip active" onclick="window.filterByCategory('all', this)">الكل</span>
        <span class="cat-chip" onclick="window.filterByCategory('مؤن', this)">مؤن أساسية</span>
        <span class="cat-chip" onclick="window.filterByCategory('ألبان', this)">ألبان وأجبان</span>
        <span class="cat-chip" onclick="window.filterByCategory('زيوت', this)">زيوت وسمن</span>
        <span class="cat-chip" onclick="window.filterByCategory('مشروبات', this)">مشروبات</span>
    </div>

    <div class="products-grid" id="productsGrid">
        <p style="grid-column: 1/-1; text-align:center; padding: 20px;">جاري تحميل المنتجات...</p>
    </div>

    <div id="cartModal">
        <div class="cart-content">
            <h2>🛒 سلة المشتريات</h2>
            <div id="cartItemsContainer"><p style="text-align:center; color:#888;">السلة فارغة حالياً.</p></div>
            <div class="cart-total">الإجمالي: <span id="cartTotalPrice">0 ل.س</span></div>
            <form id="checkoutForm">
                <input type="text" id="userPhone" placeholder="رقم هاتفك" required>
                <textarea id="userAddress" placeholder="عنوان التوصيل" required></textarea>
                <button type="submit" class="btn" id="submitBtn">تأكيد الطلب</button>
            </form>
            <button class="btn btn-close" onclick="window.toggleCartModal()">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { initMainPage } from './app.js';
        initMainPage();
    </script>
</body>
</html>
