<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tube VIP - المنصة الحصرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-play-circle"></i>
            <span>Premium<span>Tube</span></span>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن العروض الحصرية والمقاطع المسربة...">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="user-profile">
            <div class="vip-badge"><i class="fa-solid fa-crown"></i> عضوية VIP نشطة</div>
            <div class="user-avatar">M</div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li class="active" data-category="all"><i class="fa-solid fa-fire-flame-curved"></i> المقاطع الشائعة</li>
                <li data-category="leaks"><i class="fa-solid fa-unlock-keyhole"></i> تسريبات حصرية</li>
                <li data-category="action"><i class="fa-solid fa-burst"></i> إثارة وأكشن</li>
                <li data-category="cinema"><i class="fa-solid fa-film"></i> سينما الغموض</li>
            </ul>
        </aside>

        <main class="content-area">
            <div class="category-tags">
                <span class="tag active">الكل</span>
                <span class="tag">موصى به لك</span>
                <span class="tag">تمت إضافته حديثاً</span>
                <span class="tag">الأعلى تقييماً</span>
            </div>

            <div class="video-grid" id="videoGrid">
                </div>
        </main>
    </div>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <div id="modalBody">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
