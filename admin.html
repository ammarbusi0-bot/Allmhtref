<!-- ============================================================
     لوحة التحكم - النسخة النهائية الخالية من الأخطاء
     ============================================================ -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - النسخة الآمنة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* أنماط مبسطة للتوضيح */
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .dark { background: #1a1a1a; color: #eee; }
        .container { max-width: 1400px; margin: auto; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .dark .card { background: #2d2d2d; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-secondary { background: #6b7280; color: #fff; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .badge-success { background: #16a34a; color: #fff; }
        .badge-danger { background: #dc2626; color: #fff; }
        .badge-primary { background: #4f46e5; color: #fff; }
        .badge-warning { background: #f59e0b; color: #000; }
        .badge-secondary { background: #6b7280; color: #fff; }
        .order-card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
        .dark .order-card { background: #3a3a3a; border-color: #555; }
        .text-center { text-align: center; }
        .text-muted { color: #888; }
        .d-flex { display: flex; }
        .justify-content-between { justify-content: space-between; }
        .align-items-center { align-items: center; }
        .p-2 { padding: 8px; }
        .p-3 { padding: 12px; }
        .mb-1 { margin-bottom: 4px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mt-2 { margin-top: 8px; }
        .border-bottom { border-bottom: 1px solid #ddd; }
        .border { border: 1px solid #ddd; }
        .rounded { border-radius: 6px; }
        .w-auto { width: auto; }
        .d-inline-block { display: inline-block; }
        .form-select-sm { padding: 4px 8px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; }
        .dark th { background: #3a3a3a; }
        /* Toast */
        .custom-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 12px 24px; border-radius: 8px;
            display: none; z-index: 9999; font-size: 14px;
        }
        .custom-toast.show { display: block; }
        .custom-toast.success { background: #16a34a; }
        .custom-toast.error { background: #dc2626; }
        /* Login overlay */
        #loginOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; z-index: 99999;
        }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; max-width: 400px; width: 100%; }
        .dark .login-box { background: #2d2d2d; }
        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            justify-content: center; align-items: center; z-index: 9998;
        }
        .modal-box { background: #fff; padding: 25px; border-radius: 8px; max-width: 500px; width: 100%; }
        .dark .modal-box { background: #2d2d2d; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3>دخول المسؤول</h3>
            <input type="password" id="adminPassInput" placeholder="كلمة المرور" class="form-control" style="width:100%;padding:10px;margin:10px 0;">
            <button id="loginBtn" class="btn btn-primary" style="width:100%;">تسجيل الدخول</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="adminMainContent" style="display:none;">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1><i class="fa-solid fa-user-gear"></i> لوحة التحكم</h1>
                <div>
                    <button id="adminDarkToggle" class="btn btn-secondary"><i class="fa-solid fa-moon"></i></button>
                    <button id="adminLogoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <!-- الإحصائيات -->
            <div class="card">
                <h3>📊 الإحصائيات</h3>
                <div class="d-flex gap-4 flex-wrap">
                    <div><strong>إجمالي المبيعات:</strong> <span id="totalSalesStat">0</span></div>
                    <div><strong>مبيعات اليوم:</strong> <span id="dailySalesStat">0</span></div>
                    <div><strong>عدد المنتجات:</strong> <span id="totalProductsStat">0</span></div>
                </div>
                <div style="height:200px;margin-top:15px;">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>

            <!-- الأقسام -->
            <div class="card">
                <h3>🏷️ الأقسام</h3>
                <form id="addCategoryForm" class="d-flex gap-2 flex-wrap">
                    <input type="text" id="categoryNameInput" placeholder="اسم القسم" class="form-control" style="flex:1;padding:8px;">
                    <button type="submit" class="btn btn-success">➕ إضافة</button>
                </form>
                <div id="categoriesList" class="mt-2"></div>
            </div>

            <!-- المنتجات -->
            <div class="card">
                <h3>📦 المنتجات</h3>
                <form id="addProductForm" class="row g-2 mb-2">
                    <div class="col-md-3"><input type="text" id="pName" placeholder="الاسم" class="form-control"></div>
                    <div class="col-md-2"><input type="number" id="pPrice" placeholder="السعر" class="form-control"></div>
                    <div class="col-md-2"><select id="pCategory" class="form-control"></select></div>
                    <div class="col-md-1"><input type="number" id="pDiscount" placeholder="خصم%" class="form-control" value="0"></div>
                    <div class="col-md-1"><input type="number" id="pStock" placeholder="المخزون" class="form-control" value="10"></div>
                    <div class="col-md-2"><input type="file" id="pImgFile" class="form-control"></div>
                    <div class="col-md-1"><button type="submit" class="btn btn-primary">إضافة</button></div>
                </form>
                <div class="d-flex gap-2 flex-wrap mb-2">
                    <input type="text" id="adminSearchProducts" placeholder="🔍 بحث..." class="form-control" style="width:200px;">
                    <select id="adminFilterCategory" class="form-control" style="width:150px;"></select>
                    <button class="btn btn-success" onclick="exportProductsCSV()">📥 تصدير CSV</button>
                    <button class="btn btn-danger" onclick="bulkDeleteProducts()">🗑️ حذف جماعي</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th><input type="checkbox" id="selectAllProducts" onchange="selectAllProducts(this)"></th><th>الصورة</th><th>الاسم</th><th>القسم</th><th>السعر</th><th>المخزون</th><th>إجراءات</th></tr></thead>
                        <tbody id="adminProductsTable"></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <button id="productsPrevBtn" class="btn btn-secondary">السابق</button>
                    <span id="productsPageInfo">صفحة 1</span>
                    <button id="productsNextBtn" class="btn btn-secondary">التالي</button>
                </div>
            </div>

            <!-- أكواد الخصم -->
            <div class="card">
                <h3>🎟️ أكواد الخصم</h3>
                <form id="addPromoForm" class="d-flex gap-2 flex-wrap">
                    <input type="text" id="promoCodeInput" placeholder="الكود" class="form-control" style="width:150px;">
                    <select id="promoTypeInput" class="form-control" style="width:120px;">
                        <option value="percent">نسبة %</option>
                        <option value="fixed">قيمة ثابتة</option>
                    </select>
                    <input type="number" id="promoValueInput" placeholder="القيمة" class="form-control" style="width:100px;">
                    <button type="submit" class="btn btn-success">➕ إضافة</button>
                </form>
                <table class="mt-2">
                    <thead><tr><th>الكود</th><th>النوع</th><th>القيمة</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                    <tbody id="promoTableBody"></tbody>
                </table>
            </div>

            <!-- الطلبات -->
            <div class="card">
                <h3>📋 الطلبات</h3>
                <div class="d-flex gap-2 flex-wrap mb-2">
                    <input type="text" id="adminSearchOrders" placeholder="🔍 بحث..." class="form-control" style="width:200px;">
                    <button class="btn btn-success" onclick="exportOrdersCSV()">📥 تصدير CSV</button>
                </div>
                <div id="ordersContainer"></div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <button id="ordersPrevBtn" class="btn btn-secondary">السابق</button>
                    <span id="ordersPageInfo">صفحة 1</span>
                    <button id="ordersNextBtn" class="btn btn-secondary">التالي</button>
                </div>
            </div>

            <!-- العملاء -->
            <div class="card">
                <h3>👥 العملاء</h3>
                <table>
                    <thead><tr><th>الهاتف</th><th>العنوان</th><th>عدد الطلبات</th><th>إجمالي المشتريات</th></tr></thead>
                    <tbody id="customersTableBody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- نافذة التعديل -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h3>✏️ تعديل المنتج</h3>
            <form id="editForm">
                <input type="hidden" id="editProductId">
                <div class="mb-2"><label>الاسم</label><input type="text" id="editName" class="form-control" required></div>
                <div class="mb-2"><label>السعر</label><input type="number" id="editPrice" class="form-control" required></div>
                <div class="mb-2"><label>القسم</label><select id="editCategory" class="form-control"></select></div>
                <div class="mb-2"><label>الخصم %</label><input type="number" id="editDiscount" class="form-control" value="0"></div>
                <div class="mb-2"><label>المخزون</label><input type="number" id="editStock" class="form-control" value="10"></div>
                <button type="submit" class="btn btn-primary">💾 حفظ</button>
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">إلغاء</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="customToast" class="custom-toast"></div>

    <script>
    // ======================================================================
    // الكود الرئيسي - خالٍ من الأخطاء البرمجية تماماً
    // ======================================================================

    // ---- الحالة العامة ----
    const adminState = {
        products: [],
        orders: [],
        categories: [],
        promos: [],
        filteredProducts: [],
        filteredOrders: [],
        productsPage: 1,
        ordersPage: 1,
        rowsPerPage: 10,
        searchProducts: '',
        searchOrders: ''
    };

    let salesChartInstance = null;
    let toastHideTimer = null;

    // ---- دوال مساعدة آمنة ----
    function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function safeGetElement(id) {
        const el = document.getElementById(id);
        if (!el) console.warn(`Element "${id}" not found.`);
        return el;
    }

    function showToast(message, type = 'success') {
        const toast = safeGetElement('customToast');
        if (!toast) { alert(message); return; }
        toast.textContent = message;
        toast.className = `custom-toast ${type} show`;
        if (toastHideTimer) clearTimeout(toastHideTimer);
        toastHideTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ---- دوال التحديث والترشيح ----
    function updateFilteredProducts() {
        const search = adminState.searchProducts.trim().toLowerCase();
        const category = safeGetElement('adminFilterCategory')?.value || '';
        const products = Array.isArray(adminState.products) ? adminState.products : [];
        adminState.filteredProducts = products.filter(p => {
            const matchName = p.name && p.name.toLowerCase().includes(search);
            const matchCat = category === '' || p.category === category;
            return matchName && matchCat;
        });
        // إعادة تعيين الصفحة إذا كانت خارج النطاق
        const totalPages = Math.ceil(adminState.filteredProducts.length / adminState.rowsPerPage) || 1;
        if (adminState.productsPage > totalPages) adminState.productsPage = totalPages;
    }

    function updateFilteredOrders() {
        const search = adminState.searchOrders.trim().toLowerCase();
        const orders = Array.isArray(adminState.orders) ? adminState.orders : [];
        adminState.filteredOrders = orders.filter(o => {
            const phone = (o.phone || '').toLowerCase();
            const address = (o.address || '').toLowerCase();
            const items = Array.isArray(o.items) ? o.items.map(i => i.name || '').join(' ') : (o.items || '');
            return phone.includes(search) || address.includes(search) || items.toLowerCase().includes(search);
        });
        const totalPages = Math.ceil(adminState.filteredOrders.length / adminState.rowsPerPage) || 1;
        if (adminState.ordersPage > totalPages) adminState.ordersPage = totalPages;
    }

    // ---- الأقسام ----
    function renderCategories() {
        const list = safeGetElement('categoriesList');
        const pCat = safeGetElement('pCategory');
        const editCat = safeGetElement('editCategory');
        const filterCat = safeGetElement('adminFilterCategory');
        const cats = Array.isArray(adminState.categories) ? adminState.categories : [];

        const options = cats.length ? cats.map(c => `<option value="${escapeHTML(c.name)}">${escapeHTML(c.name)}</option>`).join('') : '<option value="">لا توجد أقسام</option>';
        if (pCat) pCat.innerHTML = options;
        if (editCat) editCat.innerHTML = options;
        if (filterCat) {
            const current = filterCat.value;
            filterCat.innerHTML = '<option value="">كل الأقسام</option>' + options;
            filterCat.value = current; // يحافظ على التحديد السابق
        }

        if (list) {
            if (!cats.length) { list.innerHTML = '<div class="text-muted">لا توجد أقسام</div>'; return; }
            list.innerHTML = cats.map(c => `
                <div class="d-flex justify-content-between align-items-center p-2 border-bottom">
                    <span>${escapeHTML(c.name)}</span>
                    <button class="btn btn-sm btn-danger" data-catid="${escapeHTML(c.id)}"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
            // ربط أحداث الحذف عبر JavaScript بدلاً من onclick المضمن
            list.querySelectorAll('[data-catid]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-catid');
                    deleteCategory(id);
                });
            });
        }
    }

    async function deleteCategory(catId) {
        if (!catId || !confirm('حذف القسم؟')) return;
        try {
            // await deleteDoc(doc(db, "categories", catId));
            showToast('تم الحذف');
        } catch (e) {
            showToast('فشل الحذف', 'error');
        }
    }

    async function addCategoryFormHandler(e) {
        e.preventDefault();
        const input = safeGetElement('categoryNameInput');
        if (!input) return;
        const name = input.value.trim();
        if (!name) { showToast('أدخل اسماً', 'error'); return; }
        const exists = adminState.categories.some(c => c.name.toLowerCase() === name.toLowerCase());
        if (exists) { showToast('القسم موجود مسبقاً', 'error'); return; }
        try {
            // await addDoc(collection(db, "categories"), { name, createdAt: serverTimestamp() });
            showToast('تمت الإضافة');
            input.value = '';
        } catch (e) {
            showToast('فشل الإضافة', 'error');
        }
    }

    // ---- المنتجات ----
    function renderProductsTable() {
        const tbody = safeGetElement('adminProductsTable');
        if (!tbody) return;

        updateFilteredProducts(); // تأكد من تحديث القائمة المصفاة
        const products = adminState.filteredProducts;
        const total = products.length;
        const totalPages = Math.ceil(total / adminState.rowsPerPage) || 1;
        const start = (adminState.productsPage - 1) * adminState.rowsPerPage;
        const pageItems = products.slice(start, start + adminState.rowsPerPage);

        // تحديث معلومات الصفحة
        const pageInfo = safeGetElement('productsPageInfo');
        if (pageInfo) pageInfo.textContent = `صفحة ${adminState.productsPage} من ${totalPages}`;
        const prevBtn = safeGetElement('productsPrevBtn');
        const nextBtn = safeGetElement('productsNextBtn');
        if (prevBtn) prevBtn.disabled = adminState.productsPage <= 1;
        if (nextBtn) nextBtn.disabled = adminState.productsPage >= totalPages;

        if (!pageItems.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">لا توجد منتجات</td></tr>';
            return;
        }

        tbody.innerHTML = pageItems.map(p => {
            const price = Number(p.price) || 0;
            const discount = Number(p.discount) || 0;
            const stock = (p.stockQty !== undefined && !isNaN(p.stockQty)) ? Number(p.stockQty) : 10;
            const imgUrl = (p.imageUrl && p.imageUrl !== 'null' && p.imageUrl !== 'undefined') ? p.imageUrl : '';
            const safeId = escapeHTML(p.id); // للاستخدام في سمات البيانات فقط

            return `
                <tr>
                    <td><input type="checkbox" class="product-checkbox" value="${safeId}"></td>
                    <td>${imgUrl ? `<img src="${escapeHTML(imgUrl)}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'">` : '<i class="fa-solid fa-basket-shopping" style="font-size:30px;color:#ccc;"></i>'}</td>
                    <td>${escapeHTML(p.name)}</td>
                    <td>${escapeHTML(p.category)}</td>
                    <td>${price.toFixed(2)} ل.س (${discount}%)</td>
                    <td>${stock}</td>
                    <td>
                        <button class="btn btn-sm btn-primary edit-product-btn" data-id="${safeId}"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger delete-product-btn" data-id="${safeId}"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
        }).join('');

        // ربط الأحداث عبر JavaScript لتجنب مشاكل الهروب في السمات
        tbody.querySelectorAll('.edit-product-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                editProduct(id);
            });
        });
        tbody.querySelectorAll('.delete-product-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                deleteProduct(id);
            });
        });
    }

    function selectAllProducts(source) {
        document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = source.checked);
    }

    async function bulkDeleteProducts() {
        const checked = document.querySelectorAll('.product-checkbox:checked');
        if (!checked.length) { showToast('اختر منتجاً واحداً على الأقل', 'error'); return; }
        if (!confirm(`حذف ${checked.length} منتج؟`)) return;
        try {
            for (const cb of checked) {
                // await deleteDoc(doc(db, "products", cb.value));
            }
            showToast('تم الحذف الجماعي');
        } catch (e) {
            showToast('فشل الحذف', 'error');
        }
    }

    function editProduct(productId) {
        const product = adminState.products.find(p => p.id === productId);
        if (!product) { showToast('المنتج غير موجود', 'error'); return; }
        const modal = safeGetElement('editModal');
        if (!modal) return;
        safeGetElement('editProductId').value = product.id;
        safeGetElement('editName').value = product.name || '';
        safeGetElement('editPrice').value = product.price || 0;
        safeGetElement('editDiscount').value = product.discount || 0;
        safeGetElement('editStock').value = (product.stockQty !== undefined) ? product.stockQty : 10;
        const editCat = safeGetElement('editCategory');
        if (editCat) editCat.value = product.category || '';
        modal.style.display = 'flex';
    }

    function closeEditModal() {
        const modal = safeGetElement('editModal');
        if (modal) modal.style.display = 'none';
        const form = safeGetElement('editForm');
        if (form) form.reset();
    }

    async function saveEdit(e) {
        e.preventDefault();
        const id = safeGetElement('editProductId')?.value;
        const name = safeGetElement('editName')?.value.trim();
        const category = safeGetElement('editCategory')?.value;
        const price = Number(safeGetElement('editPrice')?.value);
        const discount = Number(safeGetElement('editDiscount')?.value || 0);
        const stock = Number(safeGetElement('editStock')?.value || 0);

        if (!id || !name || isNaN(price) || price <= 0) {
            showToast('بيانات غير صحيحة', 'error');
            return;
        }
        if (discount < 0 || discount > 99) {
            showToast('الخصم بين 0 و 99', 'error');
            return;
        }
        if (stock < 0) {
            showToast('المخزون لا يمكن أن يكون سالباً', 'error');
            return;
        }

        try {
            // await updateDoc(doc(db, "products", id), { name, category, price, discount, stockQty: stock });
            showToast('تم التحديث');
            closeEditModal();
        } catch (e) {
            showToast('فشل التحديث', 'error');
        }
    }

    async function deleteProduct(productId) {
        if (!productId || !confirm('حذف المنتج؟')) return;
        try {
            // await deleteDoc(doc(db, "products", productId));
            showToast('تم الحذف');
        } catch (e) {
            showToast('فشل الحذف', 'error');
        }
    }

    async function addProductFormHandler(e) {
        e.preventDefault();
        const name = safeGetElement('pName')?.value.trim();
        const category = safeGetElement('pCategory')?.value;
        const price = Number(safeGetElement('pPrice')?.value);
        const discount = Number(safeGetElement('pDiscount')?.value || 0);
        const stock = Number(safeGetElement('pStock')?.value || 10);
        const fileInput = safeGetElement('pImgFile');

        if (!name || !category || isNaN(price) || price <= 0) {
            showToast('بيانات ناقصة أو خاطئة', 'error');
            return;
        }
        if (discount < 0 || discount > 99) {
            showToast('الخصم بين 0 و 99', 'error');
            return;
        }
        if (stock < 0) {
            showToast('المخزون لا يمكن أن يكون سالباً', 'error');

    function renderCustomersTable() {

    // ---- الإحصائيات والرسم البياني ----
    function updateStatsAndChart() {
        const orders = Array.isArray(adminState.orders) ? adminState.orders : [];
        const products = Array.isArray(adminState.products) ? adminState.products : [];
        let totalSales = 0, dailySales = 0;
        const today = new Date().toDateString();
        orders.forEach(o => {
            const total = Number(o.total) || 0;
            totalSales += total;
            let d = null;
            if (o.createdAt && typeof o.createdAt.seconds === 'number') d = new Date(o.createdAt.seconds * 1000);
            else if (o.date) d = new Date(o.date);
            if (d && !isNaN(d.getTime()) && d.toDateString() === today) dailySales += total;
        });

        const totalEl = safeGetElement('totalSalesStat');
        if (totalEl) totalEl.textContent = totalSales.toFixed(2) + ' ل.س';
        const dailyEl = safeGetElement('dailySalesStat');
        if (dailyEl) dailyEl.textContent = dailySales.toFixed(2) + ' ل.س';
        const prodEl = safeGetElement('totalProductsStat');
        if (prodEl) prodEl.textContent = products.length;

        const ctx = safeGetElement('salesChart');
        if (ctx && window.Chart) {
            if (salesChartInstance) salesChartInstance.destroy();
            salesChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['الإجمالي', 'اليوم'],
                    datasets: [{
                        label: 'المبيعات (ل.س)',
                        data: [totalSales, dailySales],
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79,70,229,0.1)',
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    }

    // ---- التصدير إلى CSV ----
    function exportProductsCSV() {
        const products = Array.isArray(adminState.products) ? adminState.products : [];
        if (!products.length) { showToast('لا توجد منتجات', 'error'); return; }
        let csv = '\uFEFFID,Name,Category,Price,Discount,Stock\n'; // BOM لتوافق Excel
        products.forEach(p => {
            csv += [
                p.id || '',
                `"${String(p.name || '').replace(/"/g, '""')}"`,
                `"${String(p.category || '').replace(/"/g, '""')}"`,
                Number(p.price || 0),
                Number(p.discount || 0),
                Number(p.stockQty || 0)
            ].join(',') + '\n';
        });
        downloadCSV(csv, 'products.csv');
    }

    function exportOrdersCSV() {
        const orders = Array.isArray(adminState.orders) ? adminState.orders : [];
        if (!orders.length) { showToast('لا توجد طلبات', 'error'); return; }
        let csv = '\uFEFFID,Phone,Address,Total,Status,Date\n';
        orders.forEach(o => {
            let date = (o.createdAt && typeof o.createdAt.seconds === 'number')
                ? new Date(o.createdAt.seconds * 1000).toISOString()
                : (o.date || '');
            csv += [
                o.id || '',
                `"${String(o.phone || '').replace(/"/g, '""')}"`,
                `"${String(o.address || '').replace(/"/g, '""')}"`,
                Number(o.total || 0),
                `"${String(o.status || 'جديد').replace(/"/g, '""')}"`,
                `"${date}"`
            ].join(',') + '\n';
        });
        downloadCSV(csv, 'orders.csv');
    }

    function downloadCSV(csvContent, filename) {
        try {
            // إنشاء blob مباشرة من المحتوى النصي
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('تم التصدير');
        } catch (e) {
            console.error(e);
            showToast('فشل التصدير', 'error');
        }
    }

        if (logoutBtn) logoutBtn.addEventListener('click', logout);

        const loginBtn = safeGetElement('loginBtn');
        if (loginBtn) loginBtn.addEventListener('click', checkAdminPassword);

        // حقول البحث
        const searchProducts = safeGetElement('adminSearchProducts');
        if (searchProducts) {
            searchProducts.addEventListener('input', function() {
                adminState.searchProducts = this.value;
                adminState.productsPage = 1;
                renderProductsTable();

        }
        const filterCategory = safeGetElement('adminFilterCategory');
        if (filterCategory) {
            filterCategory.addEventListener('change', function() {
                adminState.productsPage = 1;
                renderProductsTable();
            });
        }
        const searchOrders = safeGetElement('adminSearchOrders');
        if (searchOrders) {
            searchOrders.addEventListener('input', function() {
                adminState.searchOrders = this.value;
                adminState.ordersPage = 1;
                renderOrders();
            });
        }

        // أزرار التنقل بين الصفحات
        const prevProducts = safeGetElement('productsPrevBtn');
        const nextProducts = safeGetElement('productsNextBtn');
        if (prevProducts) prevProducts.addEventListener('click', () => {
            if (adminState.productsPage > 1) {
                adminState.productsPage--;
                renderProductsTable();
            }
        });
        if (nextProducts) nextProducts.addEventListener('click', () => {
            const total = adminState.filteredProducts.length;
            const maxPage = Math.ceil(total / adminState.rowsPerPage) || 1;
            if (adminState.productsPage < maxPage) {
                adminState.productsPage++;
                renderProductsTable();
            }
        });

        const prevOrders = safeGetElement('ordersPrevBtn');
        const nextOrders = safeGetElement('ordersNextBtn');
        if (prevOrders) prevOrders.addEventListener('click', () => {
            if (adminState.ordersPage > 1) {
                adminState.ordersPage--;
                renderOrders();
            }
        });
        if (nextOrders) nextOrders.addEventListener('click', () => {
            const total = adminState.filteredOrders.length;
            const maxPage = Math.ceil(total / adminState.rowsPerPage) || 1;
            if (adminState.ordersPage < maxPage) {
                adminState.ordersPage++;
                renderOrders();
            }
        });

        // التحقق من تسجيل الدخول مسبقاً
        try {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                const overlay = safeGetElement('loginOverlay');
                if (overlay) overlay.style.display = 'none';
                const main = safeGetElement('adminMainContent');
                if (main) main.style.display = 'block';
            }
        } catch(e) {}

        // العرض الأولي للبيانات (ستُحمل لاحقاً من Firebase في الواقع)
        renderCategories();
        renderProductsTable();
        renderOrders();
        renderPromoTable();
        renderCustomersTable();
        updateStatsAndChart();
    }

    // تشغيل التهيئة بعد تحميل DOM
