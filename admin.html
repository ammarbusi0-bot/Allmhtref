<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - ماركت الأخوة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f27a1a;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e6e6e6;
            --danger: #e63946;
            --input-bg: #f0f0f0;
            --shadow: rgba(0,0,0,0.05);
        }
        body.dark {
            --bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --text: #e0e0e0;
            --border: #444;
            --input-bg: #3a3a3a;
            --shadow: rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 10px 80px 10px;
            transition: background 0.3s, color 0.3s;
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        .login-box h2 { margin-bottom: 15px; color: var(--primary); }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            display: none;
        }
        h1, h2 { margin-bottom: 15px; color: var(--primary); }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 5px var(--shadow);
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-danger {
            background: var(--danger);
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
        }
        .table-responsive { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: var(--card-bg);
        }
        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            transition: border 0.3s;
        }
        th { background: var(--input-bg); }
        .order-card {
            border-right: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 15px;
            background: var(--card-bg);
            border-radius: 4px;
            box-shadow: 0 1px 3px var(--shadow);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .product-img-preview {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
        .dark-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            color: var(--text);
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        .dark-toggle i { transition: transform 0.3s; }
        body.dark .dark-toggle i { transform: rotate(20deg); }
    </style>
</head>
<body>

    <button class="dark-toggle" id="adminDarkToggle" title="تبديل المظهر">
        <i class="fa-solid fa-moon" id="adminDarkIcon"></i>
    </button>

    <div id="loginOverlay">
        <div class="login-box">
            <h2><i class="fa-solid fa-lock"></i> دخول المسؤول</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">يرجى إدخال كلمة المرور للوصول إلى اللوحة</p>
            <input type="password" id="adminPassInput" placeholder="أدخل كلمة المرور">
            <button class="btn" id="loginBtn">تسجيل الدخول</button>
        </div>
    </div>

    <div class="admin-container" id="adminMainContent">
        <h1><i class="fa-solid fa-user-gear"></i> لوحة إدارة المتجر</h1>

        <div class="card">
            <h2>إضافة منتج جديد</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="pName" required placeholder="مثال: زيت زيتون 1 لتر">
                </div>
                <div class="form-group">
                    <label>السعر (ل.س):</label>
                    <input type="number" id="pPrice" required placeholder="مثال: 25000">
                </div>
                <div class="form-group">
                    <label>القسم:</label>
                    <select id="pCategory" required>
                        <option value="مؤن">مؤن أساسية</option>
                        <option value="ألبان">ألبان وأجبان</option>
                        <option value="زيوت">زيوت وسمن</option>
                        <option value="مشروبات">مشروبات</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>صورة المنتج (رفع مباشر عبر ImgBB):</label>
                    <input type="file" id="pImgFile" accept="image/*">
                </div>
                <button type="submit" class="btn" id="saveProductBtn">حفظ المنتج</button>
            </form>
        </div>

        <div class="card">
            <h2>الطلبات الواردة</h2>
            <div id="ordersContainer"><p>جاري تحميل الطلبات...</p></div>
        </div>

        <div class="card">
            <h2>إدارة المنتجات الحالية</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>الصورة</th><th>الاسم</th><th>السعر</th><th>القسم</th><th>إجراء</th></tr>
                    </thead>
                    <tbody id="adminProductsTable">
                        <tr><td colspan="5" style="text-align:center;">جاري تحميل المنتجات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            doc, 
            deleteDoc, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfJthCuyCOQtyjUFtGOqDD5MhAlAKmBJU",
            authDomain: "market-30cd6.firebaseapp.com",
            projectId: "market-30cd6",
            storageBucket: "market-30cd6.firebasestorage.app",
            messagingSenderId: "339341925839",
            appId: "1:339341925839:web:c6395a82c9b88d494ec6ba",
            measurementId: "G-F7ZK7JFWHZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ===== المظهر الداكن =====
        window.toggleDarkMode = function() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('alukhowah_dark', isDark ? 'true' : 'false');
            const icon = document.getElementById('adminDarkIcon');
            if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        };

        window.loadDarkModePreference = function() {
            const saved = localStorage.getItem('alukhowah_dark');
            if (saved === 'true') {
                document.body.classList.add('dark');
                const icon = document.getElementById('adminDarkIcon');
                if (icon) icon.className = 'fa-solid fa-sun';
            }
        };

        document.getElementById('adminDarkToggle')?.addEventListener('click', window.toggleDarkMode);
        window.loadDarkModePreference();

        // ===== أدوات مساعدة =====
        window.escapeHTML = function(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        };

        // ===== رفع الصور المعالجة وتصغيرها تلقائياً إلى ImgBB =====
        window.uploadImageToImgBB = async function(fileInput) {
            if (!fileInput || !fileInput.files || !fileInput.files[0]) return null;
            const file = fileInput.files[0];

            // تحويل وتصغير الصورة تلقائياً لضمان قبولها بنسبة 100%
            const processImage = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            const maxDimension = 1200;
                            if (width > maxDimension || height > maxDimension) {
                                if (width > height) {
                                    height = Math.round((height * maxDimension) / width);
                                    width = maxDimension;
                                } else {
                                    width = Math.round((width * maxDimension) / height);
                                    height = maxDimension;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            canvas.toBlob((blob) => {
                                if (blob) resolve(blob);
                                else reject(new Error("فشل تحويل الصورة"));
                            }, 'image/jpeg', 0.8);
                        };
                        img.onerror = (err) => reject(err);
                    };
                    reader.onerror = (err) => reject(err);
                });
            };

            try {
                const processedBlob = await processImage(file);
                const formData = new FormData();
                formData.append('image', processedBlob, 'product.jpg');

                const response = await fetch('https://api.imgbb.com/1/upload?key=42b6820dc31a25d977adefc41f83aa70', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                return data.success ? data.data.url : null;
            } catch (error) {
                console.error('Upload error:', error);
                return null;
            }
        };

        // ===== تسجيل الدخول =====
        window.checkAdminPassword = function() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === "123456") {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminMainContent').style.display = 'block';
                initAdminDashboard();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        };

        document.getElementById('loginBtn')?.addEventListener('click', window.checkAdminPassword);
        document.getElementById('adminPassInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') window.checkAdminPassword();
        });

        // ===== تهيئة لوحة التحكم =====
        function initAdminDashboard() {
            const ordersContainer = document.getElementById('ordersContainer');
            const qOrders = query(collection(db, "orders"), orderBy("createdAt", "desc"));
            
            onSnapshot(qOrders, (snapshot) => {
                if (snapshot.empty) {
                    ordersContainer.innerHTML = '<p style="color:#888;">لا توجد طلبات جديدة حالياً.</p>';
                    return;
                }
                ordersContainer.innerHTML = snapshot.docs.map(docSnap => {
                    const order = docSnap.data() || {};
                    return `
                        <div class="order-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <strong>رقم الهاتف: ${window.escapeHTML(order.phone)}</strong>
                                <small style="color:#888;">${window.escapeHTML(order.date)}</small>
                            </div>
                            <p style="margin-bottom:5px;"><strong>العنوان:</strong> ${window.escapeHTML(order.address)}</p>
                            <p style="margin-bottom:5px;"><strong>الطلبات:</strong> ${window.escapeHTML(order.items)}</p>
                            <p style="color:var(--primary); font-weight:bold;"><strong>الإجمالي:</strong> ${window.escapeHTML(order.total)} ل.س</p>
                            <button class="btn btn-danger" style="margin-top:10px;" onclick="window.deleteOrder('${docSnap.id}')">حذف الطلب</button>
                        </div>
                    `;
                }).join('');
            });

            const adminTable = document.getElementById('adminProductsTable');
            const qProducts = query(collection(db, "products"), orderBy("createdAt", "desc"));

            onSnapshot(qProducts, (snapshot) => {
                if (snapshot.empty) {
                    adminTable.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد منتجات.</td></tr>';
                    return;
                }
                adminTable.innerHTML = snapshot.docs.map(docSnap => {
                    const p = docSnap.data() || {};
                    const imgUrlStr = String(p.imageUrl || '');
                    const imgTag = (imgUrlStr && imgUrlStr.trim() !== '') ?
                        `<img src="${window.escapeHTML(imgUrlStr)}" class="product-img-preview" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">` +
                        `<i class="fa-solid fa-basket-shopping" style="display:none; font-size:20px; color:#aaa;"></i>` :
                        `<i class="fa-solid fa-basket-shopping" style="font-size:20px; color:#aaa;"></i>`;
                    return `
                        <tr>
                            <td>${imgTag}</td>
                            <td>${window.escapeHTML(p.name)}</td>
                            <td>${window.escapeHTML(p.price)} ل.س</td>
                            <td>${window.escapeHTML(p.category)}</td>
                            <td><button class="btn btn-danger" onclick="window.deleteProduct('${docSnap.id}')">حذف</button></td>
                        </tr>
                    `;
                }).join('');
            });
        }

        // ===== حذف الطلب =====
        window.deleteOrder = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                } catch (e) {
                    alert('خطأ أثناء الحذف: ' + e.message);
                }
            }
        };

        // ===== حذف المنتج =====
        window.deleteProduct = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                } catch (e) {
                    alert('خطأ أثناء حذف المنتج: ' + e.message);
                }
            }
        };

        // ===== إضافة منتج =====
        document.getElementById('addProductForm')?.addEventListener('submit', async function(e) {
            e.preventDefault();

            const saveBtn = document.getElementById('saveProductBtn');
            saveBtn.innerText = 'جاري المعالجة والرفع...';
            saveBtn.disabled = true;

            const name = document.getElementById('pName').value.trim();
            const price = Number(document.getElementById('pPrice').value);
            const category = document.getElementById('pCategory').value;
            const fileInput = document.getElementById('pImgFile');

            let imageUrl = '';

            try {
                if (fileInput.files.length > 0) {
                    const uploadedUrl = await window.uploadImageToImgBB(fileInput);
                    if (uploadedUrl) {
                        imageUrl = uploadedUrl;
                    } else {
                        alert('تعذر رفع الصورة، سيتم حفظ المنتج بدون صورة.');
                    }
                }

                await addDoc(collection(db, "products"), {
                    name: String(name),
                    price: Number(price),
                    category: String(category),
                    imageUrl: String(imageUrl),
                    createdAt: serverTimestamp()
                });

                alert('تمت إضافة المنتج بنجاح!');
                this.reset();
            } catch (error) {
                alert('حدث خطأ أثناء إضافة المنتج: ' + error.message);
            } finally {
                saveBtn.innerText = 'حفظ المنتج';
                saveBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
